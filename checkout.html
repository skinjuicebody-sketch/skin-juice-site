<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | SkinSessed</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--cream:#fff8ef;--cream2:#f7eadb;--deep:#2a1d17;--berry:#a9284d;--olive:#42562b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--cream),var(--cream2));color:var(--deep);font-family:Georgia,'Times New Roman',serif;padding:28px 16px}.wrap{max-width:760px;margin:0 auto}.brand{text-align:center;margin:30px 0}.brand h1{font-size:clamp(2.8rem,9vw,5rem);margin:0}.brand span{color:var(--berry)}.brand p{margin:8px 0 0;color:var(--olive);font-size:1.1rem}.panel{background:#fff;border-radius:24px;padding:32px;box-shadow:0 16px 42px rgba(42,29,23,.12);text-align:center}h2{margin-top:0;font-size:2rem}.muted{color:#69574d;line-height:1.5}.home{display:block;text-align:center;margin-top:24px;color:var(--berry);font-weight:700}
  </style>
</head>
<body>
<main class="wrap">
  <header class="brand"><h1>Skin<span>Sessed</span></h1><p>Secure website checkout</p></header>
  <section class="panel">
    <h2>Preparing your secure checkout…</h2>
    <p class="muted">You’ll be redirected to Stripe with the exact products and quantities selected in Facebook or Instagram.</p>
  </section>
  <a class="home" href="shop.html">Return to SkinSessed Shop</a>
</main>
<script>
(function(){
  const target = 'https://skinsessed-checkout.netlify.app/checkout' + window.location.search;
  window.location.replace(target);
})();
</script>
</body>
</html>
